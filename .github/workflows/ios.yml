name: iOS CI (Unit Tests + Coverage)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  tests:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        ios: [ "18.0" ]
        device: [ "iPhone 16" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.x
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: xcodebuild test (with coverage)
        env:
          SCHEME: ToDoList
          PROJECT: ToDoList.xcodeproj
        run: |
          set -eo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.ios }}" \
            -enableCodeCoverage YES \
            test \
            -resultBundlePath "TestResults-${{ matrix.device }}-iOS${{ matrix.ios }}.xcresult"

      - name: Upload .xcresult
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.device }}-iOS${{ matrix.ios }}
          path: TestResults-${{ matrix.device }}-iOS${{ matrix.ios }}.xcresult

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            TestResults-${{ matrix.device }}-iOS${{ matrix.ios }}.xcresult
          flags: unittests
          fail_ci_if_error: true
          verbose: true

name: iOS CI (Unit Tests + Coverage)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        ios: [ "18.0", "17.5" ]   # OK même si le deployment target = 16
        device: [ "iPhone 16" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xcode 16.x pour SDK iOS 18
      - name: Select Xcode 16.x
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      # (debug) voir les runtimes/devices dispos
      - name: List runtimes & devices
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices

      # Caches pour accélérer
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ github.sha }}
          restore-keys: ${{ runner.os }}-deriveddata-

      - name: Boot simulator (best effort)
        run: |
          xcrun simctl bootstatus "${{ matrix.device }}" || true

      # Tests + coverage + .xcresult
      - name: xcodebuild test (with coverage)
        env:
          SCHEME: ToDoList
          PROJECT: ToDoList.xcodeproj
        run: |
          set -eo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.ios }}" \
            -enableCodeCoverage YES \
            test \
            -resultBundlePath "TestResults-${{ matrix.device }}-iOS${{ matrix.ios }}.xcresult"

      # Archive des résultats (.xcresult) pour consultation
      - name: Upload .xcresult
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.device }}-iOS${{ matrix.ios }}
          path: TestResults-${{ matrix.device }}-iOS${{ matrix.ios }}.xcresult
          if-no-files-found: error

      # Upload vers Codecov (lit directement le .xcresult)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          # si le repo est privé, ajoute CODECOV_TOKEN dans Settings > Secrets and variables > Actions
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            TestResults-${{ matrix.device }}-iOS${{ matrix.ios }}.xcresult
          flags: unittests
          fail_ci_if_error: true
          verbose: true
          
